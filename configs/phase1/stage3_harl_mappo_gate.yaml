# Phase 1 gate: fixed HARL-MAPPO on Stage 3 (v2.1 env + shared team reward, findings A-F, J fixed).
# Untuned defaults; must beat noop and charge beyond the 95% CI with >= 3 kills/episode.
stage: 3
algo: harl_mappo
total_steps: 2000000
episode_length: 200
n_rollout_threads: 32
reward_mode: team
state_type: EP
share_param: true
lr: 0.0005
critic_lr: 0.0005
use_linear_lr_decay: true
ppo_epoch: 5
actor_num_mini_batch: 4
critic_num_mini_batch: 4
clip_param: 0.2
entropy_coef: 0.01
gamma: 0.99
gae_lambda: 0.95
hidden_sizes: [128, 128]
use_recurrent_policy: false
action_aggregation: mean
eval_freq: 200000
n_eval_episodes: 16
n_test_episodes: 32
