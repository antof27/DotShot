# Development run (experiment log 4.4): untuned HARL-MAPPO on Stage 3, used for the second acceptance check
# and the learnability experiments. The check asked to beat noop and charge with at least 3 kills per episode.
stage: 3
algo: harl_mappo
total_steps: 2000000
episode_length: 200
n_rollout_threads: 32
reward_mode: team
state_type: EP
share_param: true
lr: 0.0005
critic_lr: 0.0005
use_linear_lr_decay: true
ppo_epoch: 5
actor_num_mini_batch: 4
critic_num_mini_batch: 4
clip_param: 0.2
entropy_coef: 0.01
gamma: 0.99
gae_lambda: 0.95
hidden_sizes: [128, 128]
use_recurrent_policy: false
action_aggregation: mean
eval_freq: 200000
n_eval_episodes: 16
n_test_episodes: 32
