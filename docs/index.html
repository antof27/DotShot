<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DotShot - Multi-Agent RL Handbook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="DotShot Game v2: Multi-Agent Reinforcement Learning Simulator, Benchmarks, and SOTA Research Handbook.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" id="theme-style" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-color: #0284c7;
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
      --content-max-width: 920px;
    }
    .markdown-section { padding: 32px 44px 56px; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 10px 0; }
    .theme-toggle-btn {
      position: fixed; top: 16px; right: 24px; z-index: 999;
      padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15, 23, 42, 0.08); cursor: pointer; font-size: 13px; font-weight: 600;
    }
    html.dark .theme-toggle-btn { background: rgba(255, 255, 255, 0.1); color: #f8fafc; }
  </style>
  <script>
    (function () {
      const saved = localStorage.getItem('dotshot_theme') || 'light';
      if (saved === 'dark') {
        document.getElementById('theme-style').setAttribute('href', 'https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css');
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Dark/Light Mode">Theme</button>
  <div id="app">Loading DotShot MARL Handbook...</div>

  <script>
    window.$docsify = {
      name: 'DotShot',
      repo: 'https://github.com/antof27/DotShot',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: 'Search chapters, math, benchmarks...',
        noData: 'No matching sections found.',
        depth: 4,
      },
      themeable: {
        readyTransition: true,
        responsiveTables: true,
      },
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="docsify-math-plugin.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      const link = document.getElementById('theme-style');
      const isDark = document.documentElement.classList.toggle('dark');
      link.setAttribute('href', isDark
        ? 'https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css'
        : 'https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css');
      localStorage.setItem('dotshot_theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
